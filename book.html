<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга — BookNest</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
    <a class="site-header__logo" href="index.html">BookNest</a>
    <nav class="site-nav" aria-label="Основная навигация">
        <ul>
        <li><a href="index.html">Каталог</a></li>
        <li><a href="loan.html">Выдача книги</a></li>
        <li><a href="profile.html">Профиль</a></li>
        </ul>
    </nav>
    </header>

<main class="page page--narrow">
  <nav class="crumbs" aria-label="Хлебные крошки">
    <ol>
      <li><a href="index.html">Каталог</a></li>
      <li id="crumb-title" aria-current="page">Книга</li>
    </ol>
  </nav>

  <h1 id="book-title">Книга</h1>

  <p id="status-loading" class="status" role="status">Загрузка…</p>
  <p id="status-error" class="status status--error" role="alert" hidden><span id="error-message"></span> <button type="button" class="btn" data-action="retry">Повторить</button></p>
  <p id="status-notfound" class="status" hidden>Книга не найдена. <a href="index.html">Вернуться в каталог</a></p>

  <article id="book-details" hidden>
    <figure>
      <img id="book-cover" src="img/cover.jpg" alt="Обложка книги" width="200" height="300">
    </figure>

    <section aria-labelledby="specs-title">
      <h2 id="specs-title">Характеристики</h2>
      <dl class="specs">
        <dt>Автор</dt><dd id="book-authors"></dd>
        <dt>Первая публикация</dt><dd id="book-published"></dd>
        <dt>Рейтинг</dt><dd id="book-rating"></dd>
        <dt>Темы</dt><dd id="book-subjects"></dd>
      </dl>
    </section>

    <section aria-labelledby="desc-title">
      <h2 id="desc-title">Описание</h2>
      <p id="book-description" class="book__description"></p>
    </section>
  </article>
</main>

    <footer class="site-footer">
    <p>&copy; 2026 BookNest · Крупин В.А., 24-ИС-1</p>
    </footer>
    <script type="module" src="book.js"></script>
</body>
</html>
