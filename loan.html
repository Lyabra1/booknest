<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выдача книги — BookNest</title>
</head>
<body>
    <header>
    <a href="index.html">BookNest</a>
    <nav aria-label="Основная навигация">
        <ul>
        <li><a href="index.html">Каталог</a></li>
        <li><a href="loan.html" aria-current="page">Выдача книги</a></li>
        <li><a href="profile.html">Профиль</a></li>
        </ul>
    </nav>
    </header>

    <main>
    <h1>Выдача книги</h1>

    <form action="#" method="post">
        <fieldset>
        <legend>Данные выдачи</legend>

        <label for="reader">Читатель</label>
        <input id="reader" name="reader_name" type="text"
                required minlength="2" maxlength="80" autocomplete="name">

        <label for="email">E-mail для напоминаний</label>
        <input id="email" name="email" type="email" required
                placeholder="student@university.kz" autocomplete="email">

        <label for="phone">Телефон (необязательно)</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">

        <label for="book">Книга</label>
        <select id="book" name="book_id" required>
            <option value="">— выберите книгу —</option>
            <option value="">— выберите книгу —</option>
            <option value="1">Солярис</option>
            <option value="2">Дюна</option>
            <option value="3">Мы</option>
            <option value="4">Чистый код</option>я
            <option value="5">Евгений Онегин</option>
            <option value="6">Сапиенс</option>
        </select>

        <label for="due">Вернуть до</label>
        <input id="due" name="due_date" type="date" required min="2026-10-17">

        <label for="copies">Экземпляров</label>
        <input id="copies" name="copies" type="number" value="1" min="1" max="3">

        <label for="note">Примечание</label>
        <textarea id="note" name="note" rows="3" maxlength="300"></textarea>

        <input id="agree" name="agree" type="checkbox" required>
        <label for="agree">Обязуюсь вернуть книгу в срок</label>

        <button type="submit">Выдать</button>
        </fieldset>
    </form>
    </main>
    
    <footer>
    <p>&copy; 2026 BookNest · Крупин В.А., 24-ИС-1</p>
    </footer>

</body>
</html>
