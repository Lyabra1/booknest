<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — BookNest</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>
    <header class="site-header">
    <a class="site-header__logo" href="index.html">BookNest</a>
    <nav class="site-nav" aria-label="Основная навигация">
        <ul>
        <li><a href="index.html" aria-current="page">Каталог</a></li>
        <li><a href="loan.html">Выдача книги</a></li>
        <li><a href="profile.html">Профиль</a></li>
        <li><a href="#wishlist-title">Мой список (<span id="wishlist-count">0</span>)</a></li>
        </ul>
    </nav>
    </header>

    <main class="page page--catalog">
    <h1>Каталог книг</h1>

    <section class="panel catalog__filters" aria-labelledby="filters-title">
        <h2 id="filters-title">Фильтры</h2>
        <form id="filters-form" class="form" action="index.html" method="get">
        <label for="q">Поиск по названию или автору</label>
        <input id="q" name="q" type="search" maxlength="100" autocomplete="off">

        <label for="genre">Жанр</label>
        <select id="genre" name="genre">
            <option value="all">Все жанры</option>
            <option value="scifi">Фантастика</option>
            <option value="history">История</option>
            <option value="poetry">Поэзия</option>
            <option value="cs">Информатика</option>
            <option value="prose">Проза</option>
        </select>

        <label for="sort">Сортировка</label>
        <select id="sort" name="sort">
            <option value="title">По названию (А–Я)</option>
            <option value="year">По году (новые сначала)</option>
            <option value="rating">По рейтингу</option>
        </select>

        <input id="available" name="available" type="checkbox" value="1">
        <label for="available">Только доступные</label>

        <button type="reset">Сбросить фильтры</button>
        </form>
    </section>

    <section class="catalog__content" aria-labelledby="list-title">
        <h2 id="list-title" aria-live="polite">Каталог</h2>
        <p id="empty-message" class="empty" hidden>Ничего не найдено. Измените запрос или нажмите «Сбросить фильтры».</p>
        <ul id="book-list" class="catalog__grid"></ul>
    </section>

    <section class="panel catalog__wishlist" aria-labelledby="wishlist-title">
        <h2 id="wishlist-title" tabindex="-1">Мой список</h2>
        <p id="wishlist-empty" class="empty" hidden>Список пуст. Нажмите «Хочу прочитать» на карточке книги.</p>
        <ul id="wishlist-list" class="wishlist__list"></ul>
    </section>
    </main>

    <footer class="site-footer">
    <p>&copy; 2026 BookNest · Крупин В.А., 24-ИС-1</p>
    </footer>
    <script type="module" src="main.js"></script>
</body>
</html>
